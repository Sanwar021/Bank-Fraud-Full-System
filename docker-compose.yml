services:
  postgres:
    image: postgres:16-alpine
    container_name: bank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bank_investigation}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bank_investigation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bank_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: bank_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN:-}
      - ML_ALLOWED_ORIGINS=${ML_ALLOWED_ORIGINS:-http://localhost:3002}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bank_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bank_investigation}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      ML_INFERENCE_TIMEOUT_MS: 150
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret-change-before-production}
      EXPOSE_DEMO_CODES: ${EXPOSE_DEMO_CODES:-true}
      ALLOWED_ORIGINS: "http://localhost:${WEB_PORT:-3002},http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3002}:80"
    depends_on:
      - api

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bank_simulator
    command: ["/app/simulator"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bank_investigation}
      DB_SSLMODE: disable
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-20}

volumes:
  postgres_data:
  redis_data:

